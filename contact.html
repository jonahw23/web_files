  <script data-cfasync="false">
    (() => {
      let theme = "style0";
      try {
        const savedTheme = localStorage.getItem("theme");
        if (/^style(?:[1-9]|1\d|2[0-5])$/.test(savedTheme)) {
          theme = savedTheme;
        }
      } catch (error) {
        console.error("Unable to read the saved theme.", error);
      }
      document.write(`<link id="theme" rel="stylesheet" href="/css/${theme}.css">`);
    })();
  </script>
